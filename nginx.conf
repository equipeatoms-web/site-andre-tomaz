# Idioma preferido do navegador. So conta quando o portugues vem PRIMEIRO na lista:
# quem tem "en-US,en;q=0.9,pt;q=0.8" quer ingles, e nao deve ser redirecionado.
map $http_accept_language $idioma_do_navegador {
    default  en;
    "~*^pt"  pt;
}

# O ?lang do seletor vence o navegador — sem isso o visitante brasileiro nunca
# conseguiria abrir a versao inglesa: voltaria para /pt/ a cada clique em EN.
map $arg_lang $idioma {
    default  $idioma_do_navegador;
    "en"     en;
    "pt"     pt;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Atras do proxy o nginx enxerga http e montaria o Location com http://,
    # derrubando o https por um salto. Redirect relativo evita isso.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # /pt vira /pt/ para os caminhos relativos da pagina continuarem valendo.
    location = /pt {
        return 301 /pt/;
    }

    # Raiz: quem chega com o navegador em portugues vai para /pt/.
    # 302, nao 301: a resposta depende do visitante e nao pode ficar gravada no
    # navegador nem em cache intermediario como se valesse para todo mundo.
    location = / {
        add_header Vary "Accept-Language";
        add_header Cache-Control "no-cache";
        if ($idioma = pt) {
            return 302 /pt/;
        }
        try_files /index.html =404;
    }

    # HTML sempre revalidado: o gerar.py reescreve as duas versoes.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Imagens, CSS e JS mudam de nome quando mudam de conteudo? Nao — entao 1 dia.
    location ~* \.(webp|png|jpg|svg|ico|woff2|mp4|css|js)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
